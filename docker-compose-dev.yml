services:
  code-lab:
    container_name: code-lab
    build:
      context: ./backend
      dockerfile: CodeLab.Web/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8001
      - CONNECTIONSTRINGS__DATABASE=Server=postgres;Port=5434;Database=code_lab_db;User Id=postgres;Password=postgres;
      - CONNECTIONSTRINGS__RABBITMQ=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - postgres
      - rabbitmq
      - code-lab-migrations
    networks:
      - platform-network
    restart: always

  code-lab-submission-worker:
    container_name: code-lab-submission-worker
    build:
      context: ./backend
      dockerfile: CodeLab.SubmissionProcessing.Worker/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - CONNECTIONSTRINGS__DATABASE=Server=postgres;Port=5434;Database=code_lab_db;User Id=postgres;Password=postgres;
      - CONNECTIONSTRINGS__RABBITMQ=amqp://guest:guest@rabbitmq:5672
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - platform-network
    restart: always

  code-lab-migrations:
    container_name: code-lab-migrations
    build:
      context: ./backend
      dockerfile: CodeLab.Web/Dockerfile
    depends_on:
      - postgres
    restart: "no"
    environment:
      - CONNECTIONSTRINGS__DATABASE=Server=postgres;Port=5434;Database=code_lab_db;User Id=postgres;Password=postgres;
      - ConnectionStrings__RabbitMq=amqp://guest:guest@rabbitmq:5672
    entrypoint: ["/bin/sh", "-c", './efbundle --connection "$$CONNECTIONSTRINGS__DATABASE"']
    networks:
      - platform-network

  seq:
    container_name: seq
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "8081:80"
      - "5341:5341"
    volumes:
      - seq-data:/data
    networks:
      - platform-network
    restart: always

  postgres:
    container_name: postgres
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - platform-network
    restart: always

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - platform-network
    restart: always

networks:
  platform-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  seq-data:
